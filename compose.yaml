services:
  api:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/tasks
    depends_on: [db]
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tasks
    volumes: [taskdata:/var/lib/postgresql/data]
  redis:
    image: redis:alpine
    ports: ["6379:6379"]

volumes:
  taskdata:
